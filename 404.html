<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена — Villa Bond</title>
  <meta name="robots" content="noindex">
  <style>
    :root{--paper:#FAF7F2;--ink:#211E1A;--mute:#6E675D;--accent:#BC5B39}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:var(--paper);color:var(--ink);
      font-family:Georgia,"Times New Roman",serif;text-align:center;padding:24px}
    .box{max-width:440px}
    .vb{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);
      font-family:-apple-system,"Segoe UI",sans-serif;margin-bottom:22px}
    h1{font-size:clamp(30px,7vw,46px);line-height:1.1;margin:0 0 12px;font-weight:600}
    p{color:var(--mute);font-size:16px;line-height:1.6;font-family:-apple-system,"Segoe UI",sans-serif;margin:0 0 26px}
    .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    a{display:inline-block;padding:13px 22px;border-radius:3px;text-decoration:none;
      font-family:-apple-system,"Segoe UI",sans-serif;font-size:15px;font-weight:500}
    a.primary{background:var(--accent);color:#fff}
    a.ghost{border:1px solid var(--ink);color:var(--ink)}
  </style>
</head>
<body>
  <div class="box">
    <div class="vb">Villa Bond · Раваи, Пхукет</div>
    <h1>Страница не найдена</h1>
    <p>Такой страницы нет. Вернитесь на главную или напишите нам напрямую.</p>
    <div class="links">
      <a class="primary" href="/">На главную</a>
      <a class="ghost" href="/en.html">English</a>
    </div>
  </div>
</body>
</html>
